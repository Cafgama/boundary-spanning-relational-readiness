name: Scarce Capacity Model tests

on:
  push:
    branches:
      - paper/scarce-interaction-capacity
    paths:
      - 'src/capacity/**'
      - 'tests/capacity_v0_1/**'
      - 'tests/capacity_v0_2/**'
      - 'tests/capacity_v0_3/**'
      - 'tests/capacity_v0_4/**'
      - 'experiments/capacity_v0_3/**'
      - 'analysis/capacity_v0_3/**'
      - '.github/workflows/capacity-v0_1-tests.yml'
  workflow_dispatch:

jobs:
  octave-capacity-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Run Model v0.1 analytical tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_1'); run_capacity_v0_1_tests"

      - name: Run Model v0.2 admission tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_2'); run_capacity_v0_2_tests"

      - name: Run Model v0.3 fluid-theory tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_3'); run_capacity_v0_3_tests"

      - name: Run Model v0.4 transferable actor-learning tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_4'); run_capacity_v0_4_tests"

      - name: Smoke-test E1 raw-data generation
        run: |
          octave --quiet --eval "addpath('experiments/capacity_v0_3'); run_admission_convergence_screening('/tmp/e1_smoke.csv', 1);"
          test $(( $(wc -l < /tmp/e1_smoke.csv) - 1 )) -eq 81

      - name: Smoke-test E1 Python summary
        run: |
          python3 analysis/capacity_v0_3/summarize_admission_convergence.py \
            --input /tmp/e1_smoke.csv \
            --output /tmp/e1_summary.csv
          test $(( $(wc -l < /tmp/e1_summary.csv) - 1 )) -eq 81
