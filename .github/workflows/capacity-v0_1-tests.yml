name: Scarce Capacity Model tests

on:
  push:
    branches:
      - paper/scarce-interaction-capacity
      - work/scarce-capacity-fluid-learning-v0.8
    paths:
      - 'src/capacity/**'
      - 'tests/capacity_v0_1/**'
      - 'tests/capacity_v0_2/**'
      - 'tests/capacity_v0_3/**'
      - 'tests/capacity_v0_4/**'
      - 'tests/capacity_v0_5/**'
      - 'tests/capacity_v0_6/**'
      - 'tests/capacity_v0_7/**'
      - 'tests/capacity_v0_8/**'
      - 'experiments/capacity_v0_3/**'
      - 'experiments/capacity_v0_6/**'
      - 'experiments/capacity_v0_7/**'
      - 'analysis/capacity_v0_3/**'
      - 'analysis/capacity_v0_6/**'
      - 'analysis/capacity_v0_7/**'
      - '.github/workflows/capacity-v0_1-tests.yml'
  workflow_dispatch:

jobs:
  octave-capacity-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Run Model v0.1 analytical tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_1'); run_capacity_v0_1_tests"

      - name: Run Model v0.2 admission tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_2'); run_capacity_v0_2_tests"

      - name: Run Model v0.3 fluid-theory tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_3'); run_capacity_v0_3_tests"

      - name: Run Model v0.4 transferable actor-learning tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_4'); run_capacity_v0_4_tests"

      - name: Run Model v0.5 endpoint competence tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_5'); run_capacity_v0_5_tests"

      - name: Run Model v0.6 continuous-readiness tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_6'); run_capacity_v0_6_tests"

      - name: Run Model v0.7 coupled capacity-learning tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_7'); run_capacity_v0_7_tests"

      - name: Run Model v0.8 coupled fluid-learning tests
        run: |
          octave --quiet --eval "cd('tests/capacity_v0_8'); run_capacity_v0_8_tests"

      - name: Smoke-test E1 raw-data generation
        run: |
          octave --quiet --eval "addpath('experiments/capacity_v0_3'); run_admission_convergence_screening('/tmp/e1_smoke.csv', 1);"
          test $(( $(wc -l < /tmp/e1_smoke.csv) - 1 )) -eq 81

      - name: Smoke-test E1 Python summary
        run: |
          python3 analysis/capacity_v0_3/summarize_admission_convergence.py \
            --input /tmp/e1_smoke.csv \
            --output /tmp/e1_summary.csv
          test $(( $(wc -l < /tmp/e1_summary.csv) - 1 )) -eq 81

      - name: Smoke-test E2 raw-data generation
        run: |
          octave --quiet --eval "addpath('experiments/capacity_v0_6'); run_learning_focus_screening('/tmp/e2_smoke.csv', 1);"
          test $(( $(wc -l < /tmp/e2_smoke.csv) - 1 )) -eq 10

      - name: Smoke-test E2 Python summary
        run: |
          python3 analysis/capacity_v0_6/summarize_learning_focus.py \
            --input /tmp/e2_smoke.csv \
            --output /tmp/e2_summary.csv
          test $(( $(wc -l < /tmp/e2_summary.csv) - 1 )) -eq 10

      - name: Smoke-test E3 raw-data generation
        run: |
          octave --quiet --eval "addpath('experiments/capacity_v0_7'); run_learning_congestion_screening('/tmp/e3_smoke.csv', 1);"
          test $(( $(wc -l < /tmp/e3_smoke.csv) - 1 )) -eq 224

      - name: Smoke-test E3 Python summary
        run: |
          python3 analysis/capacity_v0_7/summarize_learning_congestion.py \
            --input /tmp/e3_smoke.csv \
            --output /tmp/e3_summary.csv
          test $(( $(wc -l < /tmp/e3_summary.csv) - 1 )) -eq 224

      - name: Verify exact E3 complete-concentration endpoint
        run: |
          python3 - <<'PY'
          import csv
          with open('/tmp/e3_smoke.csv', newline='') as f:
              rows = [r for r in csv.DictReader(f) if abs(float(r['h'])-1.0) < 1e-12]
          assert len(rows) == 14
          for r in rows:
              assert int(float(r['delta_capacity'])) == 1
              assert int(float(r['delta_free'])) == 1
              assert float(r['T_capacity']) == 14
              assert float(r['T_free']) == 14
              assert float(r['DeltaT']) == 0
              assert int(float(r['n_blocked'])) == 0
          print('PASS: E3 h=1 exact zero-delay endpoint')
          PY
